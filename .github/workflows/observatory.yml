name: BondStats Arbitrage Observatory

on:
  workflow_dispatch:
  schedule:
    - cron: "25 17 * * 1-5"

permissions:
  contents: read

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run tests
        run: npm test

      - name: Build Observatory
        run: npm run build

      - name: Validate output
        run: npm run validate

      - name: Sync public export to BondStats
        env:
          GH_TOKEN: ${{ secrets.BONDSTATS_SITE_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/Botapi33/bondstats-site.git" site

          mkdir -p site/public/data
          mkdir -p site/src/data

          cp data/output/global-arbitrage-observatory.json \
             site/public/data/global-arbitrage-observatory.json

          cp data/output/global-arbitrage-observatory.json \
             site/src/data/global-arbitrage-observatory.json

          cd site

          git config user.name "bondstats-arbitrage-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            public/data/global-arbitrage-observatory.json \
            src/data/global-arbitrage-observatory.json

          if git diff --cached --quiet; then
            echo "No Observatory data changes."
            exit 0
          fi

          git commit -m "Update Global Arbitrage Observatory data"
          git push
