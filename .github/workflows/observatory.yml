name: BondStats Arbitrage Observatory

on:
  workflow_dispatch:
  schedule:
    - cron: "25 17 * * 1-5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test engine
        run: npm test

      - name: Build official-source snapshot
        run: npm run build

      - name: Validate snapshot
        run: npm run validate

      - name: Publish JSON
        run: |
          mkdir -p data
          cp data/output/global-arbitrage-observatory.json \
             data/global-arbitrage-observatory.json

      - name: Commit updated data
        run: |
          git config user.name "bondstats-data-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/global-arbitrage-observatory.json

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "Update Global Arbitrage Observatory data"
          git push
