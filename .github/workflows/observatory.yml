name: BondStats Arbitrage Observatory

on:
  workflow_dispatch:
  schedule:
    - cron: "25 17 * * 1-5"

permissions:
  contents: read

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Observatory
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate
        run: npm run validate

      - name: Checkout BondStats site
        uses: actions/checkout@v4
        with:
          repository: Botapi33/bondstats-site
          token: ${{ secrets.BONDSTATS_SITE_TOKEN }}
          ref: main
          path: bondstats-site

      - name: Publish Observatory data
        run: |
          mkdir -p bondstats-site/public/data
          mkdir -p bondstats-site/src/data

          cp data/output/global-arbitrage-observatory.json \
            bondstats-site/public/data/global-arbitrage-observatory.json

          cp data/output/global-arbitrage-observatory.json \
            bondstats-site/src/data/global-arbitrage-observatory.json

      - name: Push update
        working-directory: bondstats-site
        run: |
          git config user.name "bondstats-arbitrage-bot"
          git config user.email "actions@users.noreply.github.com"

          git add public/data/global-arbitrage-observatory.json
          git add src/data/global-arbitrage-observatory.json

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "Update Global Arbitrage Observatory"
          git push
